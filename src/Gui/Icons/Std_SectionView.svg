<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64px"
   height="64px"
   viewBox="0 0 64 64"
   id="svg_section_view"
   version="1.1">
  <title>Std_SectionView</title>
  <defs>
    <linearGradient id="gradTop" x1="20" y1="6" x2="32" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#e9f5ff;stop-opacity:1" />
      <stop offset="1" style="stop-color:#9fc3e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradLeft" x1="8" y1="20" x2="20" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="1" style="stop-color:#3465a4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradCut" x1="20" y1="27" x2="44" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#fcaf3e;stop-opacity:1" />
      <stop offset="1" style="stop-color:#f57900;stop-opacity:1" />
    </linearGradient>
    <clipPath id="clipCut">
      <path d="M 20,27 44,13 44,39 20,53 Z" />
    </clipPath>
  </defs>
  <!-- kept half of the block -->
  <path
     d="M 8,20 32,6 44,13 20,27 Z"
     style="fill:url(#gradTop);stroke:#0b1521;stroke-width:2;stroke-linejoin:round" />
  <path
     d="M 8,20 20,27 20,53 8,46 Z"
     style="fill:url(#gradLeft);stroke:#0b1521;stroke-width:2;stroke-linejoin:round" />
  <!-- cut face with hatch -->
  <path
     d="M 20,27 44,13 44,39 20,53 Z"
     style="fill:url(#gradCut);stroke:none" />
  <g clip-path="url(#clipCut)" style="stroke:#8f3a00;stroke-width:1.6;stroke-linecap:butt">
    <path d="M 14,40 38,4" />
    <path d="M 14,48 42,8" />
    <path d="M 14,56 46,12" />
    <path d="M 18,58 46,20" />
    <path d="M 24,58 46,28" />
    <path d="M 30,58 46,36" />
    <path d="M 36,58 48,42" />
  </g>
  <path
     d="M 20,27 44,13 44,39 20,53 Z"
     style="fill:none;stroke:#0b1521;stroke-width:2;stroke-linejoin:round" />
  <!-- section plane -->
  <path
     d="M 15,24 49,4 49,42 15,62 Z"
     style="fill:#3465a4;fill-opacity:0.18;stroke:#204a87;stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:4,2" />
</svg>
