# Temporary: the Windows build of release.yml on its own, to test fixes
name: Debug Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - name: Use drive D for packages
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling

      - name: Source
        id: source
        shell: bash
        run: tooling/packaging/ci.sh source 26.3rc2 feature/section-view 9613ba2159 src

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ steps.source.outputs.pixi_version }}
          run-install: false
          cache: false

      - name: Build
        shell: bash
        run: tooling/packaging/ci.sh build src

      - name: Package and test
        shell: bash
        run: tooling/packaging/ci.sh package src 26.3rc2-james.test 26.3rc2 dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test
          path: dist/*
          retention-days: 2
          compression-level: 0
