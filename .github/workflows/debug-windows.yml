# Temporary: which change makes the moc.exe test run fail in the Windows build
name: Debug Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    steps:
      - name: Use drive D for packages
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling

      - name: Source
        id: source
        shell: bash
        run: tooling/packaging/ci.sh source 26.3rc2 feature/section-view 9613ba2159 src

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ steps.source.outputs.pixi_version }}
          run-install: false
          cache: false

      - name: Environment
        shell: bash
        working-directory: src
        run: |
          git submodule update --init --recursive --quiet
          pixi install --frozen

      - name: Check
        shell: bash
        working-directory: src
        run: |
          d="$(cygpath -m "$GITHUB_WORKSPACE")/tooling/.github/debug"
          echo "== moc from cmake and python"
          pixi run --frozen "bash $d/check.sh" || true
          echo "== configure with the DLLs next to moc"
          cp .pixi/envs/default/Library/bin/*.dll .pixi/envs/default/Library/lib/qt6/
          pixi run --frozen "bash $d/configure.sh dlls" || true
