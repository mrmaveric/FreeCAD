# Temporary: which change makes the moc.exe test run fail in the Windows build
name: Debug Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - name: Use drive D for packages
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling

      - name: Source
        id: source
        shell: bash
        run: tooling/packaging/ci.sh source 26.3rc2 feature/section-view 9613ba2159 src

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ steps.source.outputs.pixi_version }}
          run-install: false
          cache: false

      - name: Environment
        shell: bash
        working-directory: src
        run: pixi install --frozen

      - name: Configure variants
        shell: bash
        working-directory: src
        run: |
          d="$(cygpath -m "$GITHUB_WORKSPACE")/tooling/.github/debug"
          echo "== like FreeCAD (developer tests on)"
          pixi run --frozen "bash $d/configure.sh tests-on" || true
          echo "== developer tests off"
          cat >tests-off.sh <<'EOS'
          CMAKE_ARGS="${CMAKE_ARGS:-} -DENABLE_DEVELOPER_TESTS=OFF" exec bash "$1" tests-off
          EOS
          pixi run --frozen "bash tests-off.sh $d/configure.sh" || true
          echo "== developer tests off, ccache settings"
          sed -i 's/tests-off$/tests-off-ccache/' tests-off.sh
          CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=1 CMAKE_BUILD_PARALLEL_LEVEL=4 \
            pixi run --frozen "bash tests-off.sh $d/configure.sh" || true
