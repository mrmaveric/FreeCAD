# Temporary: why moc.exe cannot find its DLLs in the Windows build
name: Debug Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - name: Use drive D for packages
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling

      - name: Source
        id: source
        shell: bash
        run: tooling/packaging/ci.sh source 26.3rc2 feature/section-view 9613ba2159 src

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ steps.source.outputs.pixi_version }}
          run-install: false
          cache: false

      - name: Environment
        shell: bash
        working-directory: src
        run: pixi install --frozen

      - name: Compare
        shell: bash
        working-directory: src
        run: |
          d="$(cygpath -m "$GITHUB_WORKSPACE")/tooling/.github/debug"
          echo "== python, string form, --frozen"; pixi run --frozen "python $d/diag.py" || true
          echo "== bash, string form, --frozen"; pixi run --frozen "bash $d/diag.sh" || true
          echo "== bash, string form, --locked"; pixi run --locked "bash $d/diag.sh" || true
          echo "== bash, args form"; pixi run --frozen bash "$d/diag.sh" || true

      - name: Short path
        shell: bash
        run: |
          tooling/packaging/ci.sh source 26.3rc2 feature/section-view 9613ba2159 /d/s
          cd /d/s && pixi install --frozen
          d="$(cygpath -m "$GITHUB_WORKSPACE")/tooling/.github/debug"
          echo "== D:\\s, python, string form"; pixi run --frozen "python $d/diag.py" || true
          echo "== D:\\s, bash, string form"; pixi run --frozen "bash $d/diag.sh" || true
